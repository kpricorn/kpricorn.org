<style>
:root{
  --paper:#f3efe8;--ink:#38342f;--mute:#8c857b;--line:#e2dbd0;
  --coral:#efb6a5;--coral-deep:#d98f7a;--sage:#c6d6c0;--sage-deep:#a3c0a0;--sky:#cfdbe6;

}
:root[data-sky=dawn]{--paper:#f6ebe6}
:root[data-sky=dusk]{--paper:#f1e5e6}
:root[data-sky=night]{--paper:#e6e5ec;--ink:#33323b;--mute:#7f7d8c;--line:#d3d1dc}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);transition:background 2s}
body{margin:0;height:100svh;overflow:hidden;position:relative;font:400 16px/1.5 "Inter Tight",ui-sans-serif,system-ui,sans-serif;letter-spacing:-.005em}
body::before{

}
a{color:inherit;text-decoration:none}
::selection{background:var(--butter)}
#stage{position:absolute;inset:0;z-index:1;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
header,footer{position:absolute;left:0;right:0;z-index:3;padding:1.25rem clamp(1.25rem,4vw,3rem);display:flex;justify-content:space-between;gap:1rem;pointer-events:none}
header{top:0;align-items:center}
footer{bottom:0;align-items:flex-end;flex-wrap:wrap}
header a,footer a{pointer-events:auto}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:500}
.k{width:24px;height:auto;overflow:visible;color:var(--coral-deep)}
.k circle{fill:currentColor;animation:assemble 1.4s var(--ease) both;animation-delay:calc(var(--i) * 28ms + 100ms);transition:transform .9s var(--ease)}
@keyframes assemble{from{transform:translate(var(--dx),var(--dy));opacity:0}}
.brand:hover .k circle{transform:translate(calc(var(--dx) * .2),calc(var(--dy) * .2))}
.clock{color:var(--mute);font-size:.9rem;font-variant-numeric:tabular-nums}
.who{margin:0;font-size:clamp(1.1rem,2.2vw,1.5rem);line-height:1.25;letter-spacing:-.02em;animation:reveal 1.2s var(--ease) both .4s}
.who b{font-weight:500}
.who em{display:block;font:italic 400 1.15em/1.2 "Instrument Serif",ui-serif,Georgia,serif;color:var(--coral-deep);letter-spacing:0}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:.7rem}
.legend{margin:0;color:var(--mute);font-size:.8rem;letter-spacing:.02em;text-align:right;animation:reveal 1.2s var(--ease) both 1s}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 .3em 0 .9em;vertical-align:0;background:var(--c)}
.links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.45rem;padding:0;margin:0;list-style:none;animation:reveal 1.2s var(--ease) both .7s}
.links a{
  display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .85rem;border-radius:999px;
  background:#fff6;border:1px solid var(--line);font-size:.88rem;font-weight:500;
  transition:background .5s var(--ease),transform .5s var(--ease),border-color .5s;
}
.links a i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.links a:hover,.links a:focus-visible{transform:translateY(-2px) rotate(-1.5deg);background:var(--c);border-color:transparent;outline:none}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}}
@media(max-width:640px){
  footer{flex-direction:column;align-items:flex-start}
  .right{align-items:flex-start}.legend{text-align:left;font-size:.75rem}.legend i{margin:0 .3em 0 0}.legend span{margin-right:.9em}

}

(() => {
  const $ = s => document.querySelector(s), NS = 'http://www.w3.org/2000/svg';
  const ON = "8,8 8,30 8,52 8,74 8,96 8,162 8,184 30,8 30,30 30,52 30,74 30,140 30,162 30,184 52,8 52,30 52,52 52,140 52,162 52,184 74,8 74,30 74,96 74,162 74,184 96,8 96,74 96,96 96,118 96,140 96,162 96,184 118,52 118,74 118,118 118,140 118,162 118,184 140,52 140,74 140,96 140,118 140,140 140,162 140,184".split(' ').map(p => p.split(',').map(Number));
  ON.sort((a, b) => Math.hypot(a[0] - 74, a[1] - 96) - Math.hypot(b[0] - 74, b[1] - 96)).forEach(([x, y], i) => {
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 8);
    c.style.cssText = `--i:${i};--dx:${(Math.random()*160-80)|0}px;--dy:${(Math.random()*220-110)|0}px`;
    $('#klogo').append(c);
  });
  /* the paper follows Zürich */
  function sky() {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en', { timeZone: 'Europe/Zurich', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date()).map(x => [x.type, x.value]));
    const h = (+p.hour % 24) + (+p.minute) / 60;
    const doy = (Date.now() - Date.UTC(new Date().getUTCFullYear(), 0, 0)) / 864e5;
    const a = Math.cos(2 * Math.PI * (doy - 172) / 365), rise = 6.85 - 1.33 * a, set = 19.05 + 2.4 * a;
    document.documentElement.dataset.sky = h < rise - 1 || h > set + 1 ? 'night' : h < rise + 1 ? 'dawn' : h > set - 1 ? 'dusk' : 'day';
    $('#time').textContent = `Zürich · ${p.hour.padStart(2, '0')}:${p.minute}`;
  }
  sky(); setInterval(sky, 30000);
})();
</script>

  const geo = new THREE.TubeGeometry(curve, segs, a.k === 'b' ? 0.022 : 0.017, radial, false);
  const pal = COLORS[a.k];
  const mat = new THREE.MeshStandardMaterial({ color: pal[i % pal.length], roughness: 1, metalness: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = 0.02;
  geo.setDrawRange(0, 0);
  scene.add(mesh);
  tubes.push({ mesh, total: geo.index.count, start: i * 0.38, dur: 1.6 + segs / 300 });
});
const END = tubes.at(-1).start + tubes.at(-1).dur;
const HOLD = 14, FADE = 1.6, CYCLE = END + HOLD + FADE;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);

let t0 = performance.now();
function frame(now) {
  const t = reduced ? END : ((now - t0) / 1000) % CYCLE;
  for (const tb of tubes) {
    let f = ease((t - tb.start) / tb.dur);
    if (t > END + HOLD) f = 1 - ease((t - END - HOLD) / FADE);      // the whole thing withdraws, then begins again
    tb.mesh.geometry.setDrawRange(0, Math.round(tb.total * f / 6) * 6);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
new MutationObserver(() => { paper.set(css('--paper')); scene.fog.color.copy(paper); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-sky'] });
</script>
</body>
